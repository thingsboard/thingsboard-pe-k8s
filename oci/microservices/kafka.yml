apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafka
  namespace: thingsboard
  labels:
    strimzi.io/cluster: tb
spec:
  replicas: 3
  roles:
    - controller
    - broker
  template:
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: In
                    values:
                      - tb-node
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: strimzi.io/pool-name
                    operator: In
                    values:
                      - kafka
              topologyKey: "kubernetes.io/hostname"
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        # OCI block volumes are at least 50 GB
        size: 50Gi
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests:
      cpu: 200m
      memory: 1500Mi
    limits:
      cpu: 2000m
      memory: 1500Mi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: tb
  namespace: thingsboard
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.1
    metadataVersion: "4.3-IV0"
    jvmOptions:
      '-Xms': 1024m
      '-Xmx': 1024m
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # ThingsBoard creates its topics with its own settings
      auto.create.topics.enable: "false"
      default.replication.factor: 3
