apiVersion: v1
kind: ConfigMap
metadata:
  name: tb-node-db-config
  namespace: thingsboard
  labels:
    name: tb-node-db-config
data:
  # The connection itself comes from the `postgres` secret (external-secrets/postgres.yml).
  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
  SPRING_DRIVER_CLASS_NAME: org.postgresql.Driver
  # Set to cassandra to store telemetry in Cassandra (cassandra/k8ssandra-cluster.yml).
  DATABASE_TS_TYPE: sql
  CASSANDRA_URL: cassandra-dc1-service:9042
  CASSANDRA_LOCAL_DATACENTER: dc1
  CASSANDRA_USE_CREDENTIALS: "true"
  CASSANDRA_READ_CONSISTENCY_LEVEL: LOCAL_QUORUM
  CASSANDRA_WRITE_CONSISTENCY_LEVEL: LOCAL_QUORUM
