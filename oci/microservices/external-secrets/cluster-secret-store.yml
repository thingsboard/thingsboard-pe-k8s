apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: oci-vault
spec:
  provider:
    oracle:
      # OKE Workload Identity of the external-secrets service account (infrastructure/vault.tf)
      principalType: Workload
      vault: YOUR_VAULT_OCID
      region: YOUR_OCI_REGION
