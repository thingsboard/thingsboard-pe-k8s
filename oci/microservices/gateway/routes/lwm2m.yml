apiVersion: gateway.networking.k8s.io/v1alpha2
kind: UDPRoute
metadata:
  name: lwm2m
  namespace: thingsboard
spec:
  parentRefs:
    - name: tb-gateway
      sectionName: lwm2m
  rules:
    - backendRefs:
        - name: tb-lwm2m-transport
          port: 5685
