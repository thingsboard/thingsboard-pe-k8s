# HTTPS with a Let's Encrypt certificate. Applied through kustomization.yml, which adds the https listener
# and moves the thingsboard route to it. Replace YOUR_DOMAIN and YOUR_EMAIL before applying.
# With Trendz, re-apply routes/trendz.yml with sectionName: https.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: YOUR_EMAIL
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: tb-gateway
                namespace: thingsboard
                kind: Gateway
                sectionName: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tb-tls
  namespace: thingsboard
spec:
  secretName: tb-tls
  dnsNames:
    - "YOUR_DOMAIN"
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
---
# Plain HTTP keeps only the device APIs and redirects everything else to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thingsboard-http
  namespace: thingsboard
spec:
  parentRefs:
    - name: tb-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/integrations/
      backendRefs:
        - name: tb-integration-executor
          port: 8082
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/
      backendRefs:
        - name: tb-http-transport
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
