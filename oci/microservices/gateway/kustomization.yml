# HTTPS: gateway.yml and routes/http.yml with the https listener added, plus https.yml.
# Render with `kubectl kustomize gateway` and replace YOUR_DOMAIN and YOUR_EMAIL before applying.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway.yml
  - routes/http.yml
  - https.yml
patches:
  - target:
      kind: Gateway
      name: tb-gateway
    patch: |-
      - op: add
        path: /spec/listeners/1
        value:
          name: https
          protocol: HTTPS
          port: 443
          hostname: "YOUR_DOMAIN"
          tls:
            mode: Terminate
            certificateRefs:
              - name: tb-tls
  - target:
      kind: HTTPRoute
      name: thingsboard
    patch: |-
      - op: add
        path: /spec/parentRefs/0/sectionName
        value: https
      - op: add
        path: /spec/hostnames
        value:
          - "YOUR_DOMAIN"
