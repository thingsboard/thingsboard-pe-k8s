apiVersion: batch/v1
kind: Job
metadata:
  name: tb-create-db
  namespace: thingsboard
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 70
        runAsNonRoot: true
      containers:
        - name: psql
          image: docker.io/library/postgres:18.6-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: postgres
          env:
            - name: PGSSLMODE
              value: require
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              DB_NAME="${PGDATABASE}"
              export PGDATABASE=postgres
              if [ "$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = '${DB_NAME}'")" = "1" ]; then
                echo "Database ${DB_NAME} already exists"
              else
                psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"${DB_NAME}\""
                echo "Database ${DB_NAME} created"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
